<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
  <title>Interactive Card Details Form</title>
</head>
<body>
  <main class="page">
    <section class="cards" aria-label="Card preview">
      <div class="card card--front">
        <img class="card__logo" src="./images/card-logo.svg" alt="">
        <div class="card__number" data-card-number>0000 0000 0000 0000</div>
        <div class="card__details">
          <span data-card-name>Jane Appleseed</span>
          <span><span data-card-month>00</span>/<span data-card-year>00</span></span>
        </div>
      </div>

      <div class="card card--back">
        <div class="card__cvc" data-card-cvc>000</div>
      </div>
    </section>

    <section class="form-panel" aria-label="Card details form">
      <form id="card-form" novalidate>
        <div class="field">
          <label for="cardholder-name">Cardholder Name</label>
          <input id="cardholder-name" name="cardholderName" type="text" placeholder="e.g. Jane Appleseed" autocomplete="cc-name">
          <p class="error" data-error="cardholderName"></p>
        </div>

        <div class="field">
          <label for="card-number">Card Number</label>
          <input id="card-number" name="cardNumber" type="text" inputmode="numeric" maxlength="19" placeholder="e.g. 1234 5678 9123 0000" autocomplete="cc-number">
          <p class="error" data-error="cardNumber"></p>
        </div>

        <div class="field-row">
          <fieldset class="field expiration-field">
            <legend>Exp. Date (MM/YY)</legend>
            <div class="expiration-inputs">
              <div>
                <label class="sr-only" for="exp-month">Expiration month</label>
                <input id="exp-month" name="expMonth" type="text" inputmode="numeric" maxlength="2" placeholder="MM" autocomplete="cc-exp-month">
              </div>
              <div>
                <label class="sr-only" for="exp-year">Expiration year</label>
                <input id="exp-year" name="expYear" type="text" inputmode="numeric" maxlength="2" placeholder="YY" autocomplete="cc-exp-year">
              </div>
            </div>
            <p class="error" data-error="expiration"></p>
          </fieldset>

          <div class="field cvc-field">
            <label for="cvc">CVC</label>
            <input id="cvc" name="cvc" type="text" inputmode="numeric" maxlength="3" placeholder="e.g. 123" autocomplete="cc-csc">
            <p class="error" data-error="cvc"></p>
          </div>
        </div>

        <button class="button" type="submit">Confirm</button>
      </form>

      <div class="complete-state" id="complete-state" hidden>
        <img src="./images/icon-complete.svg" alt="">
        <h1>Thank you!</h1>
        <p>We've added your card details</p>
        <button class="button" id="continue-button" type="button">Continue</button>
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="">DevAdeh</a>.
  </footer>
</body>
</html>
